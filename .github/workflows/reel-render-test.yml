name: Programmatic reel render test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/reels/**'
      - 'src/Root.tsx'
      - 'package.json'
      - '.github/workflows/reel-render-test.yml'

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run repository checks
        run: npm run check
      - name: Render programmatic reel test
        run: |
          npx remotion render src/index.ts ProgrammaticReelTest /tmp/programmatic-reel-test.mp4 --log=error
          test -s /tmp/programmatic-reel-test.mp4
          ls -lh /tmp/programmatic-reel-test.mp4
      - name: Upload reel test artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-reel-test
          path: /tmp/programmatic-reel-test.mp4
          retention-days: 3
